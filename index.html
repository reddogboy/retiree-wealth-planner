<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>RetireSafe | วางแผนจัดพอร์ตวัยเกษียณ</title>
    
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- โหลด React & ReactDOM -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    
    <!-- โหลด Recharts สำหรับวาดกราฟ -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js"></script>

    <style>
        body { background-color: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #334155; }
        .fade-in { animation: fadeIn 0.5s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* ซ่อนลูกศรใน input type number */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;
        const { PieChart, Pie, Cell, ResponsiveContainer, Tooltip, Legend } = window.Recharts;

        // --- Utility ---
        const formatMoney = (amount) => "฿" + Math.round(Number(amount) || 0).toLocaleString("th-TH");
        const parseNum = (str) => Number(String(str).replace(/,/g, '')) || 0;

        function App() {
            const [step, setStep] = useState(1);
            
            // --- State: เก็บข้อมูลทั้งหมด ---
            const [data, setData] = useState({
                // หมวด 1: สถานะการเงิน
                income: "", debt: "", lumpSum: "",
                // หมวด 2: ค่าใช้จ่าย
                essentialExp: "", discretionaryExp: "", largeExp: "",
                // หมวด 3: สุขภาพ
                healthCover: "partial", healthConcern: "low",
                // หมวด 4: เป้าหมาย
                risk: "low", goal: "protect", legacy: "no"
            });

            const updateData = (field, value) => setData(prev => ({ ...prev, [field]: value }));
            const handleNumberInput = (field) => (e) => {
                const rawValue = e.target.value.replace(/[^0-9]/g, '');
                if (!rawValue) { updateData(field, ""); return; }
                updateData(field, Number(rawValue).toLocaleString('en-US'));
            };

            const nextStep = () => { window.scrollTo(0,0); setStep(s => Math.min(s + 1, 5)); };
            const prevStep = () => { window.scrollTo(0,0); setStep(s => Math.max(s - 1, 1)); };
            const resetApp = () => { setStep(1); setData({ income: "", debt: "", lumpSum: "", essentialExp: "", discretionaryExp: "", largeExp: "", healthCover: "partial", healthConcern: "low", risk: "low", goal: "protect", legacy: "no" }); };

            // --- Algorithm: คำนวณผลลัพธ์ (The Bucket Strategy) ---
            const analysis = useMemo(() => {
                if (step !== 5) return null;

                const income = parseNum(data.income);
                const debt = parseNum(data.debt);
                const lumpSum = parseNum(data.lumpSum);
                const essentialExp = parseNum(data.essentialExp);
                const discretionaryExp = parseNum(data.discretionaryExp);
                const largeExp = parseNum(data.largeExp);
                
                const totalMonthlyExp = essentialExp + discretionaryExp + debt;
                const monthlyCashflow = income - totalMonthlyExp;

                // 1. คำนวณถังสำรองปลอดภัย (Safe Bucket)
                // ค่ากินอยู่พื้นฐาน 12 เดือน (หรือ 24 เดือนถ้ารายได้ติดลบ)
                const emergencyMonths = monthlyCashflow < 0 ? 24 : 12;
                const livingReserve = (essentialExp + debt) * emergencyMonths;
                
                // กันเงินค่ารักษาพยาบาล
                let healthBuffer = 0;
                if (data.healthCover === 'none') healthBuffer = 500000;
                else if (data.healthCover === 'partial') healthBuffer = 200000;
                if (data.healthConcern === 'high') healthBuffer += 300000;

                // รวมเงินก้อนที่ห้ามเสี่ยงเด็ดขาด
                const safeBucketTotal = livingReserve + healthBuffer + largeExp;

                // 2. คำนวณเงินที่ลงทุนได้จริง (Investment Bucket)
                const investableCapital = lumpSum - safeBucketTotal;
                
                // 3. จัดพอร์ตส่วนการลงทุน (Asset Allocation)
                let portfolio = [];
                let strategyName = "";
                let expectedReturn = "";
                
                if (investableCapital > 0) {
                    if (data.risk === 'low' || data.goal === 'protect') {
                        strategyName = "พอร์ตปกป้องเงินต้น (Conservative)";
                        expectedReturn = "3 - 4% ต่อปี";
                        portfolio = [
                            { name: 'กองทุนตลาดเงิน / เงินฝากประจำ', value: investableCapital * 0.30, color: '#94a3b8' },
                            { name: 'พันธบัตรรัฐบาล / ตราสารหนี้คุณภาพดี', value: investableCapital * 0.60, color: '#3b82f6' },
                            { name: 'กองทุนหุ้นโลก (ความผันผวนต่ำ)', value: investableCapital * 0.10, color: '#10b981' }
                        ];
                    } else if (data.goal === 'cashflow') {
                        strategyName = "พอร์ตเน้นกระแสเงินสด (Dividend Income)";
                        expectedReturn = "4 - 6% ต่อปี (เน้นปันผล)";
                        portfolio = [
                            { name: 'ตราสารหนี้เอกชนชั้นดี (Corporate Bonds)', value: investableCapital * 0.40, color: '#3b82f6' },
                            { name: 'กองทุนหุ้นปันผล / หุ้นเติบโตมั่นคง', value: investableCapital * 0.40, color: '#8b5cf6' },
                            { name: 'กองทุนอสังหาฯ (REITs) / โครงสร้างพื้นฐาน', value: investableCapital * 0.20, color: '#f59e0b' }
                        ];
                    } else { // Growth / Legacy
                        strategyName = "พอร์ตเติบโตเพื่ออนาคตมรดก (Balanced Growth)";
                        expectedReturn = "6 - 8% ต่อปี";
                        portfolio = [
                            { name: 'ตราสารหนี้ (ลดความผันผวน)', value: investableCapital * 0.40, color: '#3b82f6' },
                            { name: 'กองทุนหุ้นโลก (Global Equity)', value: investableCapital * 0.50, color: '#10b981' },
                            { name: 'สินทรัพย์ทางเลือก (เช่น ทองคำ)', value: investableCapital * 0.10, color: '#f59e0b' }
                        ];
                    }
                }

                return {
                    monthlyCashflow,
                    livingReserve, healthBuffer, largeExp, safeBucketTotal,
                    investableCapital,
                    strategyName, expectedReturn, portfolio
                };
            }, [step, data]);


            // --- UI Components ---
            return (
                <div className="min-h-screen pb-20">
                    {/* Header: Privacy Badge */}
                    <div className="bg-emerald-600 text-white text-center py-2 text-xs font-bold shadow-md">
                        🔒 ปลอดภัย 100%: ข้อมูลทั้งหมดถูกคำนวณบนอุปกรณ์ของคุณ ไม่มีการส่งข้อมูลออกจากระบบ
                    </div>

                    <div className="max-w-3xl mx-auto px-4 pt-8">
                        <div className="text-center mb-8">
                            <h1 className="text-3xl font-black text-slate-800 mb-2">Retire<span className="text-emerald-600">Safe</span> 🛡️</h1>
                            <p className="text-slate-500 font-medium">ออกแบบการจัดสรรเงินก้อนวัยเกษียณ ให้คุณใช้ชีวิตอย่างอุ่นใจ</p>
                        </div>

                        {/* Progress Bar */}
                        <div className="flex items-center justify-between mb-8 relative">
                            <div className="absolute top-1/2 left-0 w-full h-1 bg-slate-200 -z-10 transform -translate-y-1/2 rounded"></div>
                            <div className="absolute top-1/2 left-0 h-1 bg-emerald-500 -z-10 transform -translate-y-1/2 rounded transition-all duration-500" style={{width: `${((step-1)/4)*100}%`}}></div>
                            {[1, 2, 3, 4, 5].map(i => (
                                <div key={i} className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm transition-all border-2 ${step >= i ? 'bg-emerald-500 border-emerald-500 text-white' : 'bg-white border-slate-300 text-slate-400'}`}>
                                    {i === 5 ? '🏁' : i}
                                </div>
                            ))}
                        </div>

                        {/* --- STEP 1: สถานะการเงิน --- */}
                        {step === 1 && (
                            <div className="bg-white rounded-3xl p-6 md:p-10 shadow-xl shadow-slate-200/50 border border-slate-100 fade-in">
                                <h2 className="text-2xl font-black text-slate-800 mb-2">หมวด 1: ภาพรวมกระเป๋าเงิน 💰</h2>
                                <p className="text-slate-500 text-sm mb-8">เราต้องการทราบสถานะทางการเงินปัจจุบัน เพื่อประเมินสายป่านของคุณ</p>
                                
                                <div className="space-y-6">
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-1">1. รายรับประจำที่มีอยู่ (บาท/เดือน)</label>
                                        <p className="text-xs text-slate-400 mb-2">เช่น บำนาญ, ประกันสังคม, ค่าเช่า, ดอกเบี้ย (ถ้าไม่มีใส่ 0)</p>
                                        <div className="relative">
                                            <span className="absolute left-4 top-4 text-slate-400 font-bold">฿</span>
                                            <input type="text" inputMode="numeric" value={data.income} onChange={handleNumberInput('income')} className="w-full pl-10 pr-4 py-4 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:border-emerald-500 outline-none text-xl font-bold transition-all" placeholder="0" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-1">2. ภาระหนี้สินที่ต้องผ่อน (บาท/เดือน)</label>
                                        <p className="text-xs text-slate-400 mb-2">เช่น ผ่อนบ้าน, รถ, บัตรเครดิต (ถ้าไม่มีใส่ 0)</p>
                                        <div className="relative">
                                            <span className="absolute left-4 top-4 text-slate-400 font-bold">฿</span>
                                            <input type="text" inputMode="numeric" value={data.debt} onChange={handleNumberInput('debt')} className="w-full pl-10 pr-4 py-4 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:border-emerald-500 outline-none text-xl font-bold transition-all" placeholder="0" />
                                        </div>
                                    </div>
                                    <div className="bg-emerald-50 p-6 rounded-2xl border border-emerald-100">
                                        <label className="block font-bold text-emerald-800 mb-1">3. "เงินก้อน" สำหรับจัดสรร (บาท) ⭐</label>
                                        <p className="text-xs text-emerald-600 mb-3">เงินสุทธิที่มีอยู่ (ไม่รวมมูลค่าบ้าน/ที่ดินที่ขายยาก)</p>
                                        <div className="relative">
                                            <span className="absolute left-4 top-4 text-emerald-600 font-bold">฿</span>
                                            <input type="text" inputMode="numeric" value={data.lumpSum} onChange={handleNumberInput('lumpSum')} className="w-full pl-10 pr-4 py-4 bg-white border-2 border-emerald-200 rounded-xl focus:border-emerald-500 outline-none text-2xl font-black text-emerald-700 transition-all shadow-inner" placeholder="เช่น 5,000,000" />
                                        </div>
                                    </div>
                                </div>
                                <button onClick={nextStep} disabled={!data.lumpSum} className="w-full mt-8 bg-slate-800 text-white font-bold text-lg py-4 rounded-2xl hover:bg-slate-700 transition-all disabled:opacity-50 disabled:cursor-not-allowed">ถัดไป 👉</button>
                            </div>
                        )}

                        {/* --- STEP 2: ค่าใช้จ่าย --- */}
                        {step === 2 && (
                            <div className="bg-white rounded-3xl p-6 md:p-10 shadow-xl shadow-slate-200/50 border border-slate-100 fade-in">
                                <h2 className="text-2xl font-black text-slate-800 mb-2">หมวด 2: ค่าใช้จ่าย & ไลฟ์สไตล์ 🛒</h2>
                                <p className="text-slate-500 text-sm mb-8">เพื่อคำนวณว่าคุณต้องเตรียม "ถังน้ำสำรอง" ไว้ใหญ่แค่ไหน</p>
                                
                                <div className="space-y-6">
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-1">1. ค่าใช้จ่ายจำเป็น (บาท/เดือน)</label>
                                        <p className="text-xs text-slate-400 mb-2">ค่าอาหาร, ค่าน้ำไฟ, ยาประจำตัว (ขาดไม่ได้)</p>
                                        <div className="relative">
                                            <span className="absolute left-4 top-4 text-slate-400 font-bold">฿</span>
                                            <input type="text" inputMode="numeric" value={data.essentialExp} onChange={handleNumberInput('essentialExp')} className="w-full pl-10 pr-4 py-4 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:border-emerald-500 outline-none text-xl font-bold" placeholder="0" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-1">2. ค่าความสุข/ท่องเที่ยว (บาท/เดือน)</label>
                                        <p className="text-xs text-slate-400 mb-2">ทานอาหารนอกบ้าน, งานอดิเรก, งานบุญ</p>
                                        <div className="relative">
                                            <span className="absolute left-4 top-4 text-slate-400 font-bold">฿</span>
                                            <input type="text" inputMode="numeric" value={data.discretionaryExp} onChange={handleNumberInput('discretionaryExp')} className="w-full pl-10 pr-4 py-4 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:border-emerald-500 outline-none text-xl font-bold" placeholder="0" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-1">3. รายจ่ายก้อนใหญ่ใน 3-5 ปีข้างหน้า (บาท)</label>
                                        <p className="text-xs text-slate-400 mb-2">เช่น ซ่อมบ้าน, เปลี่ยนรถ (ถ้าไม่มีใส่ 0)</p>
                                        <div className="relative">
                                            <span className="absolute left-4 top-4 text-slate-400 font-bold">฿</span>
                                            <input type="text" inputMode="numeric" value={data.largeExp} onChange={handleNumberInput('largeExp')} className="w-full pl-10 pr-4 py-4 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:border-emerald-500 outline-none text-xl font-bold" placeholder="0" />
                                        </div>
                                    </div>
                                </div>
                                <div className="flex gap-4 mt-8">
                                    <button onClick={prevStep} className="w-1/3 bg-slate-100 text-slate-600 font-bold text-lg py-4 rounded-2xl hover:bg-slate-200 transition-all">ย้อนกลับ</button>
                                    <button onClick={nextStep} className="w-2/3 bg-slate-800 text-white font-bold text-lg py-4 rounded-2xl hover:bg-slate-700 transition-all">ถัดไป 👉</button>
                                </div>
                            </div>
                        )}

                        {/* --- STEP 3: สุขภาพ --- */}
                        {step === 3 && (
                            <div className="bg-white rounded-3xl p-6 md:p-10 shadow-xl shadow-slate-200/50 border border-slate-100 fade-in">
                                <h2 className="text-2xl font-black text-slate-800 mb-2">หมวด 3: สุขภาพ & เกราะป้องกัน 🏥</h2>
                                <p className="text-slate-500 text-sm mb-8">ความเสี่ยงอันดับ 1 วัยเกษียณคือค่ารักษาพยาบาล</p>
                                
                                <div className="space-y-6">
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-3">1. สวัสดิการค่ารักษาพยาบาลที่มีอยู่?</label>
                                        <div className="space-y-3">
                                            <label className={`flex items-center gap-3 p-4 rounded-xl border-2 cursor-pointer transition-all ${data.healthCover === 'excellent' ? 'border-emerald-500 bg-emerald-50' : 'border-slate-200 bg-slate-50 hover:border-slate-300'}`}>
                                                <input type="radio" checked={data.healthCover === 'excellent'} onChange={() => updateData('healthCover', 'excellent')} className="w-5 h-5 accent-emerald-600" />
                                                <div>
                                                    <div className="font-bold text-slate-800">ครอบคลุมสูง (เบิกได้เกือบหมด)</div>
                                                    <div className="text-xs text-slate-500">ข้าราชการ หรือ มีประกันสุขภาพเหมาจ่ายวงเงินสูง</div>
                                                </div>
                                            </label>
                                            <label className={`flex items-center gap-3 p-4 rounded-xl border-2 cursor-pointer transition-all ${data.healthCover === 'partial' ? 'border-amber-500 bg-amber-50' : 'border-slate-200 bg-slate-50 hover:border-slate-300'}`}>
                                                <input type="radio" checked={data.healthCover === 'partial'} onChange={() => updateData('healthCover', 'partial')} className="w-5 h-5 accent-amber-600" />
                                                <div>
                                                    <div className="font-bold text-slate-800">ครอบคลุมบางส่วน (บัตรทอง/ประกันสังคม)</div>
                                                    <div className="text-xs text-slate-500">อาจต้องจ่ายเพิ่มถ้ารักษาคลินิกพิเศษ หรือยานอกบัญชี</div>
                                                </div>
                                            </label>
                                            <label className={`flex items-center gap-3 p-4 rounded-xl border-2 cursor-pointer transition-all ${data.healthCover === 'none' ? 'border-rose-500 bg-rose-50' : 'border-slate-200 bg-slate-50 hover:border-slate-300'}`}>
                                                <input type="radio" checked={data.healthCover === 'none'} onChange={() => updateData('healthCover', 'none')} className="w-5 h-5 accent-rose-600" />
                                                <div>
                                                    <div className="font-bold text-slate-800">ไม่มีสวัสดิการ / จ่ายเองทั้งหมด</div>
                                                </div>
                                            </label>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-3">2. มีโรคประจำตัว หรือกังวลสุขภาพเป็นพิเศษไหม?</label>
                                        <div className="flex gap-4">
                                            <label className={`flex-1 flex flex-col items-center gap-2 p-4 rounded-xl border-2 cursor-pointer transition-all ${data.healthConcern === 'low' ? 'border-blue-500 bg-blue-50' : 'border-slate-200 bg-slate-50'}`}>
                                                <input type="radio" checked={data.healthConcern === 'low'} onChange={() => updateData('healthConcern', 'low')} className="hidden" />
                                                <span className="text-2xl">🏃‍♂️</span>
                                                <span className="font-bold text-sm text-slate-700">แข็งแรงดี</span>
                                            </label>
                                            <label className={`flex-1 flex flex-col items-center gap-2 p-4 rounded-xl border-2 cursor-pointer transition-all ${data.healthConcern === 'high' ? 'border-rose-500 bg-rose-50' : 'border-slate-200 bg-slate-50'}`}>
                                                <input type="radio" checked={data.healthConcern === 'high'} onChange={() => updateData('healthConcern', 'high')} className="hidden" />
                                                <span className="text-2xl">💊</span>
                                                <span className="font-bold text-sm text-slate-700">มีความกังวล/มีโรค</span>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                                <div className="flex gap-4 mt-8">
                                    <button onClick={prevStep} className="w-1/3 bg-slate-100 text-slate-600 font-bold text-lg py-4 rounded-2xl hover:bg-slate-200 transition-all">ย้อนกลับ</button>
                                    <button onClick={nextStep} className="w-2/3 bg-slate-800 text-white font-bold text-lg py-4 rounded-2xl hover:bg-slate-700 transition-all">ถัดไป 👉</button>
                                </div>
                            </div>
                        )}

                        {/* --- STEP 4: เป้าหมาย --- */}
                        {step === 4 && (
                            <div className="bg-white rounded-3xl p-6 md:p-10 shadow-xl shadow-slate-200/50 border border-slate-100 fade-in">
                                <h2 className="text-2xl font-black text-slate-800 mb-2">หมวด 4: เป้าหมาย & ความเสี่ยง 🎯</h2>
                                <p className="text-slate-500 text-sm mb-8">หัวใจสำคัญของการเลือกกลยุทธ์การลงทุนให้ตรงใจคุณ</p>
                                
                                <div className="space-y-6">
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-3">1. หากเงินก้อนนี้มูลค่าลดลง 10-20% ชั่วคราว คุณรู้สึกอย่างไร?</label>
                                        <div className="flex gap-3">
                                            <label className={`flex-1 flex flex-col items-center justify-center text-center gap-2 p-4 rounded-xl border-2 cursor-pointer transition-all ${data.risk === 'low' ? 'border-rose-500 bg-rose-50' : 'border-slate-200 bg-slate-50'}`}>
                                                <input type="radio" checked={data.risk === 'low'} onChange={() => updateData('risk', 'low')} className="hidden" />
                                                <span className="text-2xl">😨</span>
                                                <span className="font-bold text-xs text-slate-700">กังวล นอนไม่หลับ<br/>(รับความเสี่ยงได้ต่ำ)</span>
                                            </label>
                                            <label className={`flex-1 flex flex-col items-center justify-center text-center gap-2 p-4 rounded-xl border-2 cursor-pointer transition-all ${data.risk === 'medium' ? 'border-amber-500 bg-amber-50' : 'border-slate-200 bg-slate-50'}`}>
                                                <input type="radio" checked={data.risk === 'medium'} onChange={() => updateData('risk', 'medium')} className="hidden" />
                                                <span className="text-2xl">🤔</span>
                                                <span className="font-bold text-xs text-slate-700">เข้าใจตลาด<br/>(รับความเสี่ยงได้ปานกลาง)</span>
                                            </label>
                                        </div>
                                    </div>
                                    
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-3">2. เป้าหมายหลักของ "เงินลงทุน" ก้อนนี้คืออะไร?</label>
                                        <div className="space-y-3">
                                            <label className={`flex items-center gap-3 p-4 rounded-xl border-2 cursor-pointer transition-all ${data.goal === 'protect' ? 'border-emerald-500 bg-emerald-50' : 'border-slate-200 bg-slate-50'}`}>
                                                <input type="radio" checked={data.goal === 'protect'} onChange={() => updateData('goal', 'protect')} className="w-5 h-5 accent-emerald-600" />
                                                <div>
                                                    <div className="font-bold text-slate-800">เน้นปกป้องเงินต้นให้ปลอดภัยที่สุด 🛡️</div>
                                                    <div className="text-xs text-slate-500">ยอมรับผลตอบแทนต่ำได้ ขอแค่เงินต้นไม่หาย</div>
                                                </div>
                                            </label>
                                            <label className={`flex items-center gap-3 p-4 rounded-xl border-2 cursor-pointer transition-all ${data.goal === 'cashflow' ? 'border-blue-500 bg-blue-50' : 'border-slate-200 bg-slate-50'}`}>
                                                <input type="radio" checked={data.goal === 'cashflow'} onChange={() => updateData('goal', 'cashflow')} className="w-5 h-5 accent-blue-600" />
                                                <div>
                                                    <div className="font-bold text-slate-800">เน้นสร้างกระแสเงินสดรับ (ปันผล) 💸</div>
                                                    <div className="text-xs text-slate-500">อยากได้เงินเข้ากระเป๋าทุกเดือน/ไตรมาสมาใช้จ่าย</div>
                                                </div>
                                            </label>
                                            <label className={`flex items-center gap-3 p-4 rounded-xl border-2 cursor-pointer transition-all ${data.goal === 'growth' ? 'border-purple-500 bg-purple-50' : 'border-slate-200 bg-slate-50'}`}>
                                                <input type="radio" checked={data.goal === 'growth'} onChange={() => updateData('goal', 'growth')} className="w-5 h-5 accent-purple-600" />
                                                <div>
                                                    <div className="font-bold text-slate-800">เน้นเติบโตชนะเงินเฟ้อ / ส่งต่อมรดก 📈</div>
                                                    <div className="text-xs text-slate-500">เงินก้อนนี้ยังไม่ได้รีบใช้ อยากให้งอกเงยเต็มที่</div>
                                                </div>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                                <div className="flex gap-4 mt-8">
                                    <button onClick={prevStep} className="w-1/3 bg-slate-100 text-slate-600 font-bold text-lg py-4 rounded-2xl hover:bg-slate-200 transition-all">ย้อนกลับ</button>
                                    <button onClick={nextStep} className="w-2/3 bg-emerald-600 text-white font-black text-lg py-4 rounded-2xl hover:bg-emerald-500 transition-all shadow-lg shadow-emerald-600/30">ประมวลผลแผน 🎉</button>
                                </div>
                            </div>
                        )}

                        {/* --- STEP 5: ผลลัพธ์ (Dashboard) --- */}
                        {step === 5 && analysis && (
                            <div className="space-y-6 fade-in">
                                
                                {/* Section 1: The Buckets */}
                                <div className="bg-white rounded-3xl p-6 shadow-xl border border-slate-100">
                                    <h2 className="text-2xl font-black text-slate-800 mb-1">กลยุทธ์จัดสรรเงิน (Bucket Strategy) 🪣</h2>
                                    <p className="text-sm text-slate-500 mb-6">หลักการคือแยก "เงินที่ต้องใช้" ออกจาก "เงินลงทุน" เพื่อป้องกันความเสี่ยงเวลาตลาดผันผวน</p>
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        {/* ถังปลอดภัย */}
                                        <div className="bg-slate-50 rounded-2xl p-5 border-2 border-slate-200 relative overflow-hidden">
                                            <div className="absolute top-0 right-0 bg-slate-200 text-slate-600 text-[10px] font-bold px-3 py-1 rounded-bl-xl">ถังที่ 1: สภาพคล่อง</div>
                                            <h3 className="font-black text-lg text-slate-700 flex items-center gap-2">🛡️ ถังสำรองปลอดภัย</h3>
                                            <div className="text-3xl font-black text-slate-800 mt-2 mb-4">{formatMoney(analysis.safeBucketTotal)}</div>
                                            
                                            <div className="space-y-2 text-sm">
                                                <div className="flex justify-between border-b border-slate-200 pb-1">
                                                    <span className="text-slate-500">ค่ากินอยู่/ผ่อนหนี้ 1-2 ปี</span>
                                                    <span className="font-bold">{formatMoney(analysis.livingReserve)}</span>
                                                </div>
                                                <div className="flex justify-between border-b border-slate-200 pb-1">
                                                    <span className="text-slate-500">สำรองฉุกเฉิน/สุขภาพ</span>
                                                    <span className="font-bold">{formatMoney(analysis.healthBuffer)}</span>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span className="text-slate-500">รายจ่ายก้อนใหญ่ในอนาคต</span>
                                                    <span className="font-bold">{formatMoney(analysis.largeExp)}</span>
                                                </div>
                                            </div>
                                            <div className="mt-4 bg-white text-xs text-slate-600 p-3 rounded-xl border border-slate-200">
                                                <strong>คำแนะนำ:</strong> เงินก้อนนี้ควรเก็บในบัญชีออมทรัพย์ดอกเบี้ยสูง, สลากออมสิน หรือ กองทุนตลาดเงิน (Money Market) ที่ถอนได้ทุกวัน 
                                            </div>
                                        </div>

                                        {/* ถังลงทุน */}
                                        <div className={`rounded-2xl p-5 border-2 relative overflow-hidden ${analysis.investableCapital > 0 ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'}`}>
                                            <div className={`absolute top-0 right-0 text-[10px] font-bold px-3 py-1 rounded-bl-xl ${analysis.investableCapital > 0 ? 'bg-emerald-200 text-emerald-800' : 'bg-rose-200 text-rose-800'}`}>ถังที่ 2: การลงทุน</div>
                                            <h3 className={`font-black text-lg flex items-center gap-2 ${analysis.investableCapital > 0 ? 'text-emerald-800' : 'text-rose-800'}`}>📈 ถังสำหรับจัดพอร์ตลงทุน</h3>
                                            
                                            {analysis.investableCapital > 0 ? (
                                                <>
                                                    <div className="text-3xl font-black text-emerald-600 mt-2 mb-4">{formatMoney(analysis.investableCapital)}</div>
                                                    <p className="text-sm text-emerald-700">นี่คือเงินก้อนที่ "เย็นพอ" ที่จะนำไปรับความเสี่ยงเพื่อสร้างผลตอบแทนชนะเงินเฟ้อได้ โดยที่คุณไม่ต้องกังวลเรื่องสภาพคล่อง</p>
                                                </>
                                            ) : (
                                                <>
                                                    <div className="text-3xl font-black text-rose-600 mt-2 mb-4">฿0</div>
                                                    <p className="text-sm text-rose-700 font-bold">⚠️ ทุนสำรองของคุณยังไม่พอ!</p>
                                                    <p className="text-xs text-rose-600 mt-2">เงินก้อนที่คุณมี จำเป็นต้องใช้เป็นทุนสำรองเพื่อความปลอดภัยทั้งหมด เราไม่แนะนำให้นำเงินก้อนนี้ไปลงทุนในสินทรัพย์เสี่ยง (เช่น หุ้น) เด็ดขาด</p>
                                                </>
                                            )}
                                        </div>
                                    </div>
                                </div>

                                {/* Section 2: Portfolio Recommendation */}
                                {analysis.investableCapital > 0 && (
                                    <div className="bg-white rounded-3xl p-6 shadow-xl border border-slate-100">
                                        <h2 className="text-xl font-black text-slate-800 mb-1">โมเดลพอร์ตแนะนำสำหรับคุณ 📊</h2>
                                        <p className="text-sm text-slate-500 mb-6">จัดตามระดับความเสี่ยงและเป้าหมายที่คุณเลือก: <strong className="text-emerald-600">{analysis.strategyName}</strong></p>
                                        
                                        <div className="flex flex-col md:flex-row items-center gap-8">
                                            {/* Graph */}
                                            <div className="w-full md:w-1/2 h-64">
                                                <ResponsiveContainer width="100%" height="100%">
                                                    <PieChart>
                                                        <Pie data={analysis.portfolio} cx="50%" cy="50%" innerRadius={60} outerRadius={90} paddingAngle={5} dataKey="value">
                                                            {analysis.portfolio.map((entry, index) => (
                                                                <Cell key={`cell-${index}`} fill={entry.color} />
                                                            ))}
                                                        </Pie>
                                                        <Tooltip formatter={(value) => formatMoney(value)} />
                                                    </PieChart>
                                                </ResponsiveContainer>
                                            </div>
                                            
                                            {/* Breakdown */}
                                            <div className="w-full md:w-1/2 space-y-4">
                                                <div className="bg-slate-50 p-4 rounded-xl border border-slate-100 mb-4 text-center">
                                                    <div className="text-xs font-bold text-slate-500 uppercase">ผลตอบแทนคาดหวัง</div>
                                                    <div className="text-xl font-black text-emerald-600">{analysis.expectedReturn}</div>
                                                </div>
                                                
                                                {analysis.portfolio.map((item, i) => (
                                                    <div key={i} className="flex justify-between items-center text-sm border-b border-slate-100 pb-2">
                                                        <div className="flex items-center gap-2">
                                                            <div className="w-3 h-3 rounded-full" style={{backgroundColor: item.color}}></div>
                                                            <span className="font-bold text-slate-700">{item.name}</span>
                                                        </div>
                                                        <div className="text-right">
                                                            <div className="font-black text-slate-800">{((item.value / analysis.investableCapital) * 100).toFixed(0)}%</div>
                                                            <div className="text-xs text-slate-500">{formatMoney(item.value)}</div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                <div className="text-center pt-4">
                                    <button onClick={resetApp} className="text-slate-500 font-bold hover:text-slate-800 underline">🔄 ทำแบบประเมินใหม่อีกครั้ง</button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
