<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<!-- บังคับไม่ให้ผู้ใช้ซูมด้วยนิ้ว -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RetireSafe | วางแผนจัดพอร์ตวัยเกษียณ</title>
<!-- โหลด Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- โหลด React & ReactDOM -->
<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
<!-- [NEW] โหลด react-is เพื่อแก้ปัญหาจอขาวจาก Recharts -->
<script src="https://unpkg.com/react-is@18.2.0/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js"></script>
<style>
body { background-color: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #334155; }
.fade-in { animation: fadeIn 0.5s ease-in-out forwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.hide-scrollbar::-webkit-scrollbar { display: none; }
/* สไตล์สำหรับปุ่ม Progress ที่กดได้ */
.step-clickable { cursor: pointer; transition: transform 0.2s; }
.step-clickable:hover { transform: scale(1.1); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
/* [NEW] กฎเหล็กป้องกัน iOS Auto-Zoom: Input ทุกตัวต้องขนาด 16px ขึ้นไปบนจอมือถือ */
@media screen and (max-width: 768px) {
input[type="text"], input[type="number"], select, textarea {
font-size: 16px !important;
}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;
const { PieChart, Pie, Cell, ResponsiveContainer, Tooltip, AreaChart, Area, XAxis, YAxis, CartesianGrid } = window.Recharts;
// --- Utility ---
const formatMoney = (amount) => "฿" + Math.round(Number(amount) || 0).toLocaleString("th-TH");
const formatShort = (num) => {
if(num >= 1000000) return (num / 1000000).toFixed(2) + 'M';
if(num >= 100000) return (num / 1000).toFixed(0) + 'k';
return num.toLocaleString('th-TH');
};
const parseNum = (str) => Number(String(str).replace(/,/g, '')) || 0;
function App() {
const [step, setStep] = useState(1);
const [highestStep, setHighestStep] = useState(1);
// --- State: เก็บข้อมูลทั้งหมด ---
const [data, setData] = useState({
currentAge: "60", expectAge: "85",
income: "", totalDebt: "", lumpSum: "",
essentialExp: "", discretionaryExp: "", largeExp: "", inflation: "3",
healthCover: "partial", healthConcern: "low",
experience: "1", reaction: "2", risk: "1", goal: "1"
});
const updateData = (field, value) => setData(prev => ({ ...prev, [field]: value }));
const handleNumberInput = (field) => (e) => {
const rawValue = e.target.value.replace(/[^0-9]/g, '');
if (field === 'currentAge' || field === 'expectAge' || field === 'inflation') {
updateData(field, rawValue);
} else {
if (!rawValue) { updateData(field, ""); return; }
updateData(field, Number(rawValue).toLocaleString('en-US'));
}
};
const navigateStep = (targetStep) => {
if (targetStep <= highestStep) {
window.scrollTo({ top: 0, behavior: 'smooth' });
setStep(targetStep);
}
};
const nextStep = () => {
window.scrollTo({ top: 0, behavior: 'smooth' });
const next = Math.min(step + 1, 5);
setStep(next);
setHighestStep(prev => Math.max(prev, next));
};
const prevStep = () => {
window.scrollTo({ top: 0, behavior: 'smooth' });
setStep(s => Math.max(s - 1, 1));
};
const resetApp = () => {
setStep(1);
setHighestStep(1);
setData({
currentAge: "60", expectAge: "85", income: "", totalDebt: "", lumpSum: "",
essentialExp: "", discretionaryExp: "", largeExp: "", inflation: "3",
healthCover: "partial", healthConcern: "low",
experience: "1", reaction: "2", risk: "1", goal: "1"
});
};
// --- Algorithm: The Bucket Strategy, Risk Scoring & Projection ---
const analysis = useMemo(() => {
if (step !== 5) return null;
const currentAge = parseNum(data.currentAge) || 60;
const expectAge = parseNum(data.expectAge) || 85;
const yearsRemaining = Math.max(1, expectAge - currentAge);
const inflation = (parseNum(data.inflation) || 3) / 100;
const income = parseNum(data.income);
const totalDebt = parseNum(data.totalDebt);
const lumpSum = parseNum(data.lumpSum);
const essentialExp = parseNum(data.essentialExp);
const discretionaryExp = parseNum(data.discretionaryExp);
const largeExp = parseNum(data.largeExp);
// 1. Debt Clearance & Cashflow Logic
const netLumpSum = lumpSum - totalDebt;
const totalMonthlyExp = essentialExp + discretionaryExp;
let monthlyShortfall = totalMonthlyExp - income;
if (monthlyShortfall < 0) monthlyShortfall = 0;
const annualShortfall = monthlyShortfall * 12;
// 2. Safe Bucket
const livingReserve = essentialExp * 12;
let healthBuffer = 0;
if (data.healthCover === 'none') healthBuffer = 500000;
else if (data.healthCover === 'partial') healthBuffer = 200000;
if (data.healthConcern === 'high') healthBuffer += 300000;
const safeBucketTotal = livingReserve + healthBuffer + largeExp;
const investableCapital = netLumpSum - safeBucketTotal;
// 3. Advanced Risk Scoring (4-12 points)
const scoreEx = parseInt(data.experience);
const scoreRe = parseInt(data.reaction);
const scoreRi = parseInt(data.risk);
const scoreGo = parseInt(data.goal);
const totalScore = scoreEx + scoreRe + scoreRi + scoreGo;
let strategyName, expectedReturn, expectedReturnDec, portfolio;
if (totalScore <= 6) {
strategyName = "พอร์ตปกป้องเงินต้น (Conservative)";
expectedReturn = "3.5% ต่อปี"; expectedReturnDec = 0.035;
portfolio = [
{ name: 'เงินฝาก / กองทุนตลาดเงิน', value: investableCapital * 0.30, color: '#94a3b8' },
{ name: 'พันธบัตรรัฐบาล / หุ้นกู้เรทติ้งสูง', value: investableCapital * 0.60, color: '#3b82f6' },
{ name: 'กองทุนหุ้นโลกความผันผวนต่ำ', value: investableCapital * 0.10, color: '#10b981' }
];
} else if (totalScore <= 9) {
strategyName = "พอร์ตกระแสเงินสดและเติบโต (Moderate)";
expectedReturn = "5.5% ต่อปี"; expectedReturnDec = 0.055;
portfolio = [
{ name: 'ตราสารหนี้เอกชนชั้นดี (Corporate Bonds)', value: investableCapital * 0.30, color: '#3b82f6' },
{ name: 'หุ้นปันผล / โครงสร้างพื้นฐาน / REITs', value: investableCapital * 0.40, color: '#8b5cf6' },
{ name: 'ดัชนีหุ้นโลก (Global Equity)', value: investableCapital * 0.30, color: '#10b981' }
];
} else {
strategyName = "พอร์ตเติบโตเพื่อเป็นมรดก (Growth)";
expectedReturn = "7.5% ต่อปี"; expectedReturnDec = 0.075;
portfolio = [
{ name: 'ตราสารหนี้ (ลดความผันผวนของพอร์ต)', value: investableCapital * 0.20, color: '#3b82f6' },
{ name: 'ดัชนีหุ้นโลก และ หุ้นกลุ่มเติบโต', value: investableCapital * 0.70, color: '#10b981' },
{ name: 'สินทรัพย์ทางเลือก (เช่น ทองคำ)', value: investableCapital * 0.10, color: '#f59e0b' }
];
}
// 4. Survival Check & Projection Chart Data
let swrStatus = "";
let swrMessage = "";
let swrClass = "";
let swrIcon = "";
let yearsLast = 0;
let projectionData = [];
if (investableCapital <= 0) {
swrStatus = "เน้นสร้างความปลอดภัยก่อน 🛡️";
swrMessage = netLumpSum > 0
? ⁠เงินก้อนที่มีเหมาะสำหรับกันไว้เป็นทุนสำรองฉุกเฉินและสภาพคล่องทั้งหมด แนะนำให้ฝากออมทรัพย์หรือกองทุนตลาดเงิน ไม่ควรนำไปลงทุนเสี่ยง⁠
: ⁠ปัจจุบันคุณมียอดหนี้สินสูงกว่าเงินก้อนที่มี แนะนำให้โฟกัสที่การปลดหนี้และลดรายจ่ายเป็นอันดับแรกสุด⁠;
swrClass = "text-amber-600"; swrIcon = "bg-amber-100 border-amber-200";
let curSafe = netLumpSum > 0 ? netLumpSum : 0;
let curShortfall = annualShortfall;
for(let i=0; i<=yearsRemaining; i++) {
projectionData.push({ age: currentAge + i, wealth: Math.max(0, curSafe) });
curSafe -= curShortfall;
curShortfall *= (1+inflation);
if(curSafe <= 0) { yearsLast = i; break; }
}
} else {
let curInv = investableCapital;
let curSafe = safeBucketTotal;
let curShortfall = annualShortfall;
for (let i = 0; i <= yearsRemaining + 10; i++) {
projectionData.push({
age: currentAge + i,
wealth: Math.max(0, curInv + curSafe)
});
if (curInv > 0) {
curInv = (curInv - curShortfall) * (1 + expectedReturnDec);
if (curInv < 0) {
curSafe += curInv;
curInv = 0;
}
} else {
curSafe -= curShortfall;
}
curShortfall *= (1 + inflation);
if (curInv <= 0 && curSafe <= 0) {
yearsLast = i;
break;
} else {
yearsLast = i + 1;
}
}
if (annualShortfall === 0 || yearsLast >= yearsRemaining) {
swrStatus = annualShortfall === 0 ? "อิสรภาพทางการเงิน 100% 🌟" : "พอร์ตยั่งยืนและปลอดภัย 🟢";
swrMessage = annualShortfall === 0
? "รายรับประจำ/บำนาญ ของคุณครอบคลุมรายจ่ายทั้งหมดแล้ว! เงินลงทุนส่วนนี้สามารถจัดพอร์ตให้เติบโตเพื่อเป็นมรดกได้เต็มที่"
: ⁠ผลตอบแทนน่าจะเพียงพอถอนใช้ไปจนถึงอายุ ${currentAge + yearsLast} ปี (ครอบคลุมอายุขัยที่ตั้งเป้า) โดยเอาชนะเงินเฟ้อได้สบายๆ⁠;
swrClass = "text-emerald-600"; swrIcon = "bg-emerald-100 border-emerald-200";
} else {
swrStatus = ⁠เงินอาจหมดตอนอายุ ${currentAge + yearsLast} ปี ⚠️⁠;
swrMessage = ⁠ผลตอบแทนอาจไม่พอครอบคลุมรายจ่ายที่เติบโตตามเงินเฟ้อ แนะนำให้: 1) ปรับลดรายจ่าย 2) หารายได้เสริม หรือ 3) เลื่อนอายุเกษียณ⁠;
swrClass = "text-rose-600"; swrIcon = "bg-rose-100 border-rose-200";
}
}
// 5. Action Plan Logic
let actionPlan = [];
actionPlan.push({
title: "1. แยกถังปลอดภัย (Safe Bucket)",
desc: ⁠แยกเงินจำนวน ${formatMoney(safeBucketTotal)} ไปไว้ในบัญชีออมทรัพย์ดอกเบี้ยสูง กองทุนตลาดเงิน หรือสลากออมสิน เพื่อให้ถอนใช้จ่ายรายวันและยามฉุกเฉินได้ทันที โดยไม่ต้องกังวลว่าตลาดหุ้นจะตก⁠
});
if (investableCapital > 0) {
if (investableCapital > 1000000) {
actionPlan.push({
title: "2. ทยอยลงทุนถังเติบโต (Investment Bucket)",
desc: ⁠เนื่องจากมีเงินลงทุนค่อนข้างสูง (${formatMoney(investableCapital)}) ไม่แนะนำให้ทุ่มลงทุนก้อนเดียว (Lump Sum) เพื่อป้องกันความเสี่ยงที่ตลาดอาจร่วงหนักในระยะสั้น แนะนำให้ "แบ่งเข้าซื้อ (DCA) เป็น 3-6 ไม้" ทุกๆ เดือน ตามโมเดลพอร์ต ${strategyName} ที่ระบบจัดไว้ให้⁠
});
} else {
actionPlan.push({
title: "2. ลงทุนถังเติบโต (Investment Bucket)",
desc: ⁠นำเงิน ${formatMoney(investableCapital)} ไปลงทุนจัดพอร์ตตามโมเดล ${strategyName} ได้เลยในครั้งเดียว (Lump Sum) แล้วปล่อยให้ดอกเบี้ยทบต้นทำงาน⁠
});
}
actionPlan.push({
title: "3. ระบบการถอนเงิน (Withdrawal Rule)",
desc: ⁠เมื่อถึงเวลาต้องใช้เงิน ให้ถอนเงินปันผลหรือขายส่วนกำไรจากพอร์ตลงทุนมาใช้ หากปีไหนเกิดวิกฤตเศรษฐกิจพอร์ตติดลบ ให้หยุดขายหุ้น แล้วหันไปดึงเงินจาก "ถังปลอดภัย" มาใช้แทนชั่วคราว เพื่อรอให้พอร์ตฟื้นตัว⁠
});
}
return {
yearsRemaining, netLumpSum, monthlyShortfall, annualShortfall,
livingReserve, healthBuffer, largeExp, safeBucketTotal, investableCapital, totalDebt,
strategyName, expectedReturn, expectedReturnDec, portfolio, inflation,
swrStatus, swrMessage, swrClass, swrIcon, yearsLast, projectionData, actionPlan
};
}, [step, data]);
return (
<div className="min-h-screen pb-20">
<div className="bg-emerald-600 text-white text-center py-2 text-[10px] md:text-xs font-bold shadow-md">
🔒 ปลอดภัย 100%: ข้อมูลทั้งหมดประมวลผลบนเครื่องของคุณ ไม่มีการบันทึกหรือส่งออกสู่ภายนอก
</div>
<div className="max-w-3xl mx-auto px-4 pt-8">
<div className="text-center mb-8">
<h1 className="text-3xl font-black text-slate-800 mb-2">Retire<span className="text-emerald-600">Safe</span> 🛡️</h1>
<p className="text-slate-500 font-medium text-sm">วางแผนจัดสรรเงินก้อน เพื่อชีวิตเกษียณที่ไร้กังวล</p>
</div>
{/* Interactive Progress Bar */}
<div className="flex items-center justify-between mb-8 relative px-2">
<div className="absolute top-1/2 left-2 right-2 h-1 bg-slate-200 -z-10 transform -translate-y-1/2 rounded"></div>
<div className="absolute top-1/2 left-2 h-1 bg-emerald-500 -z-10 transform -translate-y-1/2 rounded transition-all duration-500" style={{width: ⁠calc(${((step-1)/4)*100}% - 4px)⁠}}></div>
{[1, 2, 3, 4, 5].map(i => {
const isClickable = i <= highestStep;
const isActive = step === i;
const isCompleted = i < step;
return (
<div
key={i}
onClick={() => isClickable && navigateStep(i)}
className={⁠w-9 h-9 rounded-full flex items-center justify-center font-bold text-sm transition-all border-2  ${isActive ? 'bg-emerald-500 border-emerald-500 text-white shadow-md shadow-emerald-500/40 scale-110' :  isCompleted ? 'bg-emerald-100 border-emerald-500 text-emerald-600 step-clickable' :  isClickable ? 'bg-white border-slate-300 text-slate-600 step-clickable hover:border-emerald-400' : 'bg-white border-slate-200 text-slate-300'}⁠}
title={isClickable ? ⁠กลับไปหมวด ${i}⁠ : ''}
>
{i === 5 ? '🏁' : (isCompleted && !isActive ? '✓' : i)}
</div>
);
})}
</div>
{/* --- STEP 1: สถานะการเงิน --- */}
{step === 1 && (
<div className="bg-white rounded-3xl p-6 md:p-10 shadow-xl shadow-slate-200/50 border border-slate-100 fade-in">
<h2 className="text-2xl font-black text-slate-800 mb-2">หมวด 1: ข้อมูลตั้งต้น 💰</h2>
<p className="text-slate-500 text-sm mb-6">เพื่อประเมินระยะเวลาสายป่านที่คุณต้องเตรียมการ</p>
<div className="space-y-5">
<div className="grid grid-cols-2 gap-4 bg-slate-50 p-4 rounded-2xl border border-slate-200">
<div>
<label className="block font-bold text-slate-700 mb-1 text-sm">อายุปัจจุบัน</label>
<input type="number" value={data.currentAge} onChange={handleNumberInput('currentAge')} className="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl focus:border-emerald-500 outline-none text-lg font-bold" />
</div>
<div>
<label className="block font-bold text-slate-700 mb-1 text-sm">อายุขัย (เป้าหมาย)</label>
<input type="number" value={data.expectAge} onChange={handleNumberInput('expectAge')} className="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl focus:border-emerald-500 outline-none text-lg font-bold" />
</div>
</div>
<div>
<label className="block font-bold text-slate-700 mb-1">รายรับต่อเดือนที่จะได้หลังเกษียณ (บาท)</label>
<p className="text-[11px] text-slate-400 mb-2">เช่น บำนาญ, ประกันสังคม, ค่าเช่ารับ (ถ้าไม่มีใส่ 0)</p>
<div className="relative">
<span className="absolute left-4 top-4 text-slate-400 font-bold">฿</span>
<input type="text" inputMode="numeric" value={data.income} onChange={handleNumberInput('income')} className="w-full pl-10 pr-4 py-4 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:border-emerald-500 outline-none text-xl font-bold transition-all" placeholder="0" />
</div>
</div>
<div>
<label className="block font-bold text-slate-700 mb-1">หนี้สินคงค้างที่ตั้งใจจะโปะปิด (บาท)</label>
<p className="text-[11px] text-slate-400 mb-2">ระบบจะหักหนี้ก้อนนี้ออกจากเงินก้อนทันที เพื่อประเมินเงินลงทุนสุทธิ</p>
<div className="relative">
<span className="absolute left-4 top-4 text-slate-400 font-bold">฿</span>
<input type="text" inputMode="numeric" value={data.totalDebt} onChange={handleNumberInput('totalDebt')} className="w-full pl-10 pr-4 py-4 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:border-emerald-500 outline-none text-xl font-bold transition-all" placeholder="0" />
</div>
</div>
<div className="bg-emerald-50 p-5 rounded-2xl border border-emerald-100">
<label className="block font-bold text-emerald-800 mb-1">"เงินก้อน" สำหรับจัดสรร (บาท) ⭐</label>
<p className="text-[11px] text-emerald-600 mb-2">เช่น เงินก้อนเกษียณ, กบข., กองทุน (ไม่รวมบ้าน/รถที่ขายยาก)</p>
<div className="relative">
<span className="absolute left-4 top-3.5 text-emerald-600 font-bold text-xl">฿</span>
<input type="text" inputMode="numeric" value={data.lumpSum} onChange={handleNumberInput('lumpSum')} className="w-full pl-10 pr-4 py-3 bg-white border-2 border-emerald-200 rounded-xl focus:border-emerald-500 outline-none text-2xl font-black text-emerald-700 transition-all shadow-inner" placeholder="เช่น 5,000,000" />
</div>
</div>
</div>
<button onClick={nextStep} disabled={data.lumpSum === ""} className="w-full mt-6 bg-slate-800 text-white font-bold text-lg py-4 rounded-2xl hover:bg-slate-700 transition-all disabled:opacity-50">ถัดไป 👉</button>
</div>
)}
{/* --- STEP 2: ค่าใช้จ่าย --- */}
{step === 2 && (
<div className="bg-white rounded-3xl p-6 md:p-10 shadow-xl shadow-slate-200/50 border border-slate-100 fade-in">
<h2 className="text-2xl font-black text-slate-800 mb-2">หมวด 2: ค่าใช้จ่าย & เงินเฟ้อ 🛒</h2>
<p className="text-slate-500 text-sm mb-8">ประเมินเงินที่คุณต้องใช้ต่อเดือน และรับมือกับของแพง</p>
<div className="space-y-6">
<div>
<label className="block font-bold text-slate-700 mb-1">ค่าใช้จ่ายจำเป็น (บาท/เดือน)</label>
<p className="text-xs text-slate-400 mb-2">เช่น อาหาร, น้ำไฟ, ของใช้พื้นฐาน (ขาดไม่ได้)</p>
<div className="relative">
<span className="absolute left-4 top-4 text-slate-400 font-bold">฿</span>

// [NEW] Error Boundary ดักจับหน้าจอขาว
class ErrorBoundary extends React.Component {
constructor(props) {
super(props);
this.state = { hasError: false, errorMsg: '' };
}
static getDerivedStateFromError(error) {
return { hasError: true, errorMsg: error.toString() };
}
componentDidCatch(error, errorInfo) {
console.error("RetireSafe Error:", error, errorInfo);
}
render() {
if (this.state.hasError) {
return (
<div className="min-h-screen flex items-center justify-center p-6 bg-rose-50 text-center">
<div className="max-w-md bg-white p-8 rounded-3xl shadow-xl border-t-4 border-rose-500">
<div className="text-5xl mb-4">🚨</div>
<h2 className="text-xl font-black text-slate-800 mb-2">ระบบขัดข้องชั่วคราว</h2>
<p className="text-sm text-slate-500 mb-6">โค้ดบางส่วนเกิดข้อผิดพลาด: {this.state.errorMsg}</p>
<button onClick={() => window.location.reload()} className="w-full bg-slate-800 text-white font-bold py-3 rounded-xl hover:bg-slate-700">🔄 รีเฟรชหน้าจอ</button>
</div>
</div>
);
}
return this.props.children;
}
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
