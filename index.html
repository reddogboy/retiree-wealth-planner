<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>RetireSafe | วางแผนจัดพอร์ตวัยเกษียณ</title>
    
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- โหลด React & ReactDOM -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    
    <!-- โหลด Recharts สำหรับวาดกราฟ -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js"></script>

    <style>
        body { background-color: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #334155; }
        .fade-in { animation: fadeIn 0.5s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;
        const { PieChart, Pie, Cell, ResponsiveContainer, Tooltip } = window.Recharts;

        // --- Utility ---
        const formatMoney = (amount) => "฿" + Math.round(Number(amount) || 0).toLocaleString("th-TH");
        const formatShort = (num) => {
            if(num >= 1000000) return (num / 1000000).toFixed(2) + 'M';
            if(num >= 100000) return (num / 1000).toFixed(0) + 'k'; 
            return num.toLocaleString('th-TH');
        };
        const parseNum = (str) => Number(String(str).replace(/,/g, '')) || 0;

        function App() {
            const [step, setStep] = useState(1);
            
            // --- State: เก็บข้อมูลทั้งหมด ---
            const [data, setData] = useState({
                currentAge: "60", expectAge: "85",
                income: "", totalDebt: "", lumpSum: "",
                essentialExp: "", discretionaryExp: "", largeExp: "", inflation: "3",
                healthCover: "partial", healthConcern: "low",
                risk: "low", goal: "protect"
            });

            const updateData = (field, value) => setData(prev => ({ ...prev, [field]: value }));
            const handleNumberInput = (field) => (e) => {
                const rawValue = e.target.value.replace(/[^0-9]/g, '');
                if (field === 'currentAge' || field === 'expectAge' || field === 'inflation') {
                    updateData(field, rawValue);
                } else {
                    if (!rawValue) { updateData(field, ""); return; }
                    updateData(field, Number(rawValue).toLocaleString('en-US'));
                }
            };

            const nextStep = () => { window.scrollTo({ top: 0, behavior: 'smooth' }); setStep(s => Math.min(s + 1, 5)); };
            const prevStep = () => { window.scrollTo({ top: 0, behavior: 'smooth' }); setStep(s => Math.max(s - 1, 1)); };
            const resetApp = () => { 
                setStep(1); 
                setData({ 
                    currentAge: "60", expectAge: "85", income: "", totalDebt: "", lumpSum: "", 
                    essentialExp: "", discretionaryExp: "", largeExp: "", inflation: "3", 
                    healthCover: "partial", healthConcern: "low", risk: "low", goal: "protect" 
                }); 
            };

            // --- Algorithm: The Bucket Strategy & Safe Withdrawal Rate ---
            const analysis = useMemo(() => {
                if (step !== 5) return null;

                const currentAge = parseNum(data.currentAge) || 60;
                const expectAge = parseNum(data.expectAge) || 85;
                const yearsRemaining = Math.max(1, expectAge - currentAge);
                
                const inflation = (parseNum(data.inflation) || 3) / 100;
                const income = parseNum(data.income);
                const totalDebt = parseNum(data.totalDebt);
                const lumpSum = parseNum(data.lumpSum);
                
                const essentialExp = parseNum(data.essentialExp);
                const discretionaryExp = parseNum(data.discretionaryExp);
                const largeExp = parseNum(data.largeExp);
                
                // 1. Debt Clearance Logic
                const netLumpSum = lumpSum - totalDebt;

                // 2. Cashflow Calculation
                const totalMonthlyExp = essentialExp + discretionaryExp;
                let monthlyShortfall = totalMonthlyExp - income;
                if (monthlyShortfall < 0) monthlyShortfall = 0; // มีรายรับเหลือเฟือ
                const annualShortfall = monthlyShortfall * 12;

                // 3. Safe Bucket (หักเฉพาะหนี้ที่จะไม่โปะ หรือค่ากินอยู่ 12 เดือน)
                const livingReserve = essentialExp * 12; 
                let healthBuffer = 0;
                if (data.healthCover === 'none') healthBuffer = 500000;
                else if (data.healthCover === 'partial') healthBuffer = 200000;
                if (data.healthConcern === 'high') healthBuffer += 300000;

                const safeBucketTotal = livingReserve + healthBuffer + largeExp;
                const investableCapital = netLumpSum - safeBucketTotal;

                // 4. Portfolio Allocation (Scoring Logic)
                const riskScore = data.risk === 'low' ? 1 : (data.risk === 'medium' ? 2 : 3);
                const goalScore = data.goal === 'protect' ? 1 : (data.goal === 'cashflow' ? 2 : 3);
                const totalScore = riskScore + goalScore;

                let strategyName, expectedReturn, expectedReturnDec, portfolio;
                
                if (totalScore <= 3) {
                    strategyName = "พอร์ตปกป้องเงินต้น (Conservative)";
                    expectedReturn = "3 - 4% ต่อปี"; expectedReturnDec = 0.035;
                    portfolio = [
                        { name: 'เงินฝาก / กองทุนตลาดเงิน (เช่น K-CASH)', value: investableCapital * 0.30, color: '#94a3b8' },
                        { name: 'พันธบัตรรัฐบาลไทย (เช่น B-TREASURY)', value: investableCapital * 0.60, color: '#3b82f6' },
                        { name: 'กองทุนหุ้นผันผวนต่ำ (เช่น TMBGQG)', value: investableCapital * 0.10, color: '#10b981' }
                    ];
                } else if (totalScore <= 4) {
                    strategyName = "พอร์ตเน้นกระแสเงินสด (Income/Moderate)";
                    expectedReturn = "4 - 6% ต่อปี"; expectedReturnDec = 0.05;
                    portfolio = [
                        { name: 'ตราสารหนี้เอกชนชั้นดี (เช่น K-FIXED)', value: investableCapital * 0.40, color: '#3b82f6' },
                        { name: 'หุ้นปันผล / โครงสร้างพื้นฐาน (เช่น T-PREMIUM)', value: investableCapital * 0.40, color: '#8b5cf6' },
                        { name: 'ทรัสต์อสังหาฯ REITs (เช่น PRINCIPAL iPROP)', value: investableCapital * 0.20, color: '#f59e0b' }
                    ];
                } else {
                    strategyName = "พอร์ตเติบโตเพื่ออนาคต (Growth)";
                    expectedReturn = "6 - 8% ต่อปี"; expectedReturnDec = 0.07;
                    portfolio = [
                        { name: 'ตราสารหนี้ลดความผันผวน (เช่น K-FIXED)', value: investableCapital * 0.30, color: '#3b82f6' },
                        { name: 'ดัชนีหุ้นโลก S&P500 / Global (เช่น KFGBRAND)', value: investableCapital * 0.60, color: '#10b981' },
                        { name: 'สินทรัพย์ทางเลือก ทองคำ (เช่น SCBGOLD)', value: investableCapital * 0.10, color: '#f59e0b' }
                    ];
                }

                // 5. Survival Check (SWR) Algorithm
                let swrStatus = "";
                let swrMessage = "";
                let swrClass = "";
                let swrIcon = "";
                let yearsLast = 0;

                if (investableCapital <= 0) {
                    swrStatus = "เน้นสร้างความปลอดภัยก่อน 🛡️";
                    swrMessage = netLumpSum > 0 
                        ? `เงินก้อนที่มีเหมาะสำหรับกันไว้เป็นทุนสำรองฉุกเฉินและสภาพคล่องทั้งหมด แนะนำให้ฝากออมทรัพย์หรือกองทุนตลาดเงิน ไม่ควรนำไปลงทุนเสี่ยง`
                        : `ปัจจุบันคุณมียอดหนี้สินสูงกว่าเงินก้อนที่มี แนะนำให้โฟกัสที่การปลดหนี้และลดรายจ่ายเป็นอันดับแรกสุด`;
                    swrClass = "text-amber-600"; swrIcon = "bg-amber-100 border-amber-200";
                } else if (annualShortfall === 0) {
                    swrStatus = "อิสรภาพทางการเงิน 100% 🌟";
                    swrMessage = "รายรับประจำ/บำนาญ ของคุณครอบคลุมรายจ่ายทั้งหมดแล้ว! เงินลงทุนส่วนนี้สามารถจัดพอร์ตให้เติบโตเพื่อเป็นมรดกได้เต็มที่";
                    swrClass = "text-emerald-600"; swrIcon = "bg-emerald-100 border-emerald-200";
                    yearsLast = 100;
                } else {
                    // หาว่าเงินจะหมดในกี่ปี
                    let balance = investableCapital;
                    let currentWithdrawal = annualShortfall;
                    
                    while (balance > 0 && yearsLast < 100) {
                        balance = (balance - currentWithdrawal) * (1 + expectedReturnDec);
                        currentWithdrawal *= (1 + inflation);
                        yearsLast++;
                    }

                    if (yearsLast >= yearsRemaining) {
                        swrStatus = "พอร์ตยั่งยืนและปลอดภัย 🟢";
                        swrMessage = `ผลตอบแทนน่าจะเพียงพอถอนใช้ไปอีก ${yearsLast} ปี (ครอบคลุมอายุขัยที่ตั้งไว้) โดยเอาชนะเงินเฟ้อได้สบายๆ`;
                        swrClass = "text-emerald-600"; swrIcon = "bg-emerald-100 border-emerald-200";
                    } else {
                        swrStatus = `เงินก้อนนี้อาจหมดใน ${yearsLast} ปี ⚠️`;
                        swrMessage = `ผลตอบแทนอาจไม่พอครอบคลุมรายจ่ายที่เติบโตตามเงินเฟ้อ แนะนำให้: 1) ปรับลดรายจ่ายลง 2) หาช่องทางรายได้เสริม หรือ 3) เลื่อนอายุเกษียณออกไป`;
                        swrClass = "text-rose-600"; swrIcon = "bg-rose-100 border-rose-200";
                    }
                }

                return {
                    yearsRemaining, netLumpSum, monthlyShortfall, annualShortfall,
                    livingReserve, healthBuffer, largeExp, safeBucketTotal, investableCapital, totalDebt,
                    strategyName, expectedReturn, expectedReturnDec, portfolio, inflation,
                    swrStatus, swrMessage, swrClass, swrIcon, yearsLast
                };
            }, [step, data]);

            // --- คัดลอกสรุปแผน ---
            const copyPlan = () => {
                if (!analysis) return;
                let text = `🎯 สรุปแผนเกษียณ RetireSafe\n\n`;
                text += `👤 อายุ: ${data.currentAge} ปี (ตั้งเป้าอายุขัย: ${data.expectAge} ปี)\n`;
                text += `💼 เงินก้อนที่มีเพื่อจัดสรร: ${formatMoney(analysis.netLumpSum)} (หลังหักหนี้)\n`;
                text += `🔻 รายจ่ายที่ยังขาด (Shortfall): ${formatMoney(analysis.monthlyShortfall)} / เดือน\n\n`;
                
                text += `🪣 ถังที่ 1: สภาพคล่องและฉุกเฉิน (Safe Bucket)\n`;
                text += `   มูลค่า: ${formatMoney(analysis.safeBucketTotal)}\n\n`;
                
                if (analysis.investableCapital > 0) {
                    text += `📈 ถังที่ 2: การลงทุน (Investment Bucket)\n`;
                    text += `   มูลค่า: ${formatMoney(analysis.investableCapital)}\n`;
                    text += `   โมเดล: ${analysis.strategyName}\n`;
                    text += `   ผลตอบแทนคาดหวัง: ${analysis.expectedReturn}\n\n`;
                }

                text += `💡 สถานะพอร์ต: ${analysis.swrStatus}\n`;
                text += `   ${analysis.swrMessage}\n\n`;
                text += `ลองประเมินแผนของคุณได้ที่ RetireSafe Simulator`;

                navigator.clipboard.writeText(text).then(() => {
                    const btn = document.getElementById('btnCopyPlan');
                    const orig = btn.innerHTML;
                    btn.innerHTML = '✅ คัดลอกสำเร็จ!';
                    btn.classList.replace('bg-slate-800', 'bg-emerald-600');
                    setTimeout(() => {
                        btn.innerHTML = orig;
                        btn.classList.replace('bg-emerald-600', 'bg-slate-800');
                    }, 2000);
                });
            };

            // --- UI Components ---
            return (
                <div className="min-h-screen pb-20">
                    <div className="bg-emerald-600 text-white text-center py-2 text-[10px] md:text-xs font-bold shadow-md">
                        🔒 ปลอดภัย 100%: ข้อมูลทั้งหมดถูกคำนวณบนอุปกรณ์ของคุณ ไม่มีการส่งข้อมูลออกจากระบบ
                    </div>

                    <div className="max-w-3xl mx-auto px-4 pt-8">
                        <div className="text-center mb-8">
                            <h1 className="text-3xl font-black text-slate-800 mb-2">Retire<span className="text-emerald-600">Safe</span> 🛡️</h1>
                            <p className="text-slate-500 font-medium text-sm">ออกแบบการจัดสรรเงินก้อนวัยเกษียณ ให้เงินไม่หมด</p>
                        </div>

                        {/* Progress Bar */}
                        <div className="flex items-center justify-between mb-8 relative">
                            <div className="absolute top-1/2 left-0 w-full h-1 bg-slate-200 -z-10 transform -translate-y-1/2 rounded"></div>
                            <div className="absolute top-1/2 left-0 h-1 bg-emerald-500 -z-10 transform -translate-y-1/2 rounded transition-all duration-500" style={{width: `${((step-1)/4)*100}%`}}></div>
                            {[1, 2, 3, 4, 5].map(i => (
                                <div key={i} className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm transition-all border-2 ${step >= i ? 'bg-emerald-500 border-emerald-500 text-white shadow-md shadow-emerald-500/30' : 'bg-white border-slate-300 text-slate-400'}`}>
                                    {i === 5 ? '🏁' : i}
                                </div>
                            ))}
                        </div>

                        {/* --- STEP 1: สถานะการเงิน --- */}
                        {step === 1 && (
                            <div className="bg-white rounded-3xl p-6 md:p-10 shadow-xl shadow-slate-200/50 border border-slate-100 fade-in">
                                <h2 className="text-2xl font-black text-slate-800 mb-2">หมวด 1: ข้อมูลตั้งต้น 💰</h2>
                                <p className="text-slate-500 text-sm mb-6">เพื่อประเมินว่าคุณต้องเตรียมตัวสำหรับกี่ปี</p>
                                
                                <div className="space-y-5">
                                    <div className="grid grid-cols-2 gap-4 bg-slate-50 p-4 rounded-2xl border border-slate-200">
                                        <div>
                                            <label className="block font-bold text-slate-700 mb-1 text-sm">อายุปัจจุบัน</label>
                                            <input type="number" value={data.currentAge} onChange={handleNumberInput('currentAge')} className="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl focus:border-emerald-500 outline-none text-lg font-bold" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-slate-700 mb-1 text-sm">คาดหวังอายุขัย</label>
                                            <input type="number" value={data.expectAge} onChange={handleNumberInput('expectAge')} className="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl focus:border-emerald-500 outline-none text-lg font-bold" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-1">รายรับต่อเดือนที่จะได้หลังเกษียณ (บาท/เดือน)</label>
                                        <p className="text-[11px] text-slate-400 mb-2">เช่น บำนาญชราภาพ, ประกันสังคม, ค่าเช่า (ถ้าไม่มีใส่ 0)</p>
                                        <div className="relative">
                                            <span className="absolute left-4 top-4 text-slate-400 font-bold">฿</span>
                                            <input type="text" inputMode="numeric" value={data.income} onChange={handleNumberInput('income')} className="w-full pl-10 pr-4 py-4 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:border-emerald-500 outline-none text-xl font-bold transition-all" placeholder="0" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-1">ยอดหนี้สินคงค้างทั้งหมด (บาท)</label>
                                        <p className="text-[11px] text-slate-400 mb-2">หนี้ที่ตั้งใจจะหักออกจากเงินก้อนเพื่อปลดภาระทันที (ถ้าไม่มีใส่ 0)</p>
                                        <div className="relative">
                                            <span className="absolute left-4 top-4 text-slate-400 font-bold">฿</span>
                                            <input type="text" inputMode="numeric" value={data.totalDebt} onChange={handleNumberInput('totalDebt')} className="w-full pl-10 pr-4 py-4 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:border-emerald-500 outline-none text-xl font-bold transition-all" placeholder="0" />
                                        </div>
                                    </div>
                                    <div className="bg-emerald-50 p-5 rounded-2xl border border-emerald-100">
                                        <label className="block font-bold text-emerald-800 mb-1">"เงินก้อน" สำหรับจัดสรร (บาท) ⭐</label>
                                        <p className="text-[11px] text-emerald-600 mb-2">เช่น เงินก้อนเกษียณ, กบข., Provident Fund (ไม่รวมมูลค่าบ้านที่อยู่อาศัย)</p>
                                        <div className="relative">
                                            <span className="absolute left-4 top-3.5 text-emerald-600 font-bold text-xl">฿</span>
                                            <input type="text" inputMode="numeric" value={data.lumpSum} onChange={handleNumberInput('lumpSum')} className="w-full pl-10 pr-4 py-3 bg-white border-2 border-emerald-200 rounded-xl focus:border-emerald-500 outline-none text-2xl font-black text-emerald-700 transition-all shadow-inner" placeholder="เช่น 5,000,000" />
                                        </div>
                                    </div>
                                </div>
                                <button onClick={nextStep} disabled={data.lumpSum === ""} className="w-full mt-6 bg-slate-800 text-white font-bold text-lg py-4 rounded-2xl hover:bg-slate-700 transition-all disabled:opacity-50">ถัดไป 👉</button>
                            </div>
                        )}

                        {/* --- STEP 2: ค่าใช้จ่าย --- */}
                        {step === 2 && (
                            <div className="bg-white rounded-3xl p-6 md:p-10 shadow-xl shadow-slate-200/50 border border-slate-100 fade-in">
                                <h2 className="text-2xl font-black text-slate-800 mb-2">หมวด 2: ค่าใช้จ่าย & เงินเฟ้อ 🛒</h2>
                                <p className="text-slate-500 text-sm mb-8">เพื่อประเมินเงินที่ต้องใช้ในแต่ละเดือน และรับมือกับของแพง</p>
                                
                                <div className="space-y-6">
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-1">ค่าใช้จ่ายจำเป็น (บาท/เดือน)</label>
                                        <p className="text-xs text-slate-400 mb-2">เช่น ค่าอาหาร, ค่าน้ำไฟ, ของใช้, ส่วนกลาง (ขาดไม่ได้)</p>
                                        <div className="relative">
                                            <span className="absolute left-4 top-4 text-slate-400 font-bold">฿</span>
                                            <input type="text" inputMode="numeric" value={data.essentialExp} onChange={handleNumberInput('essentialExp')} className="w-full pl-10 pr-4 py-4 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:border-emerald-500 outline-none text-xl font-bold" placeholder="0" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-1">ค่าความสุข/ท่องเที่ยว (บาท/เดือน)</label>
                                        <p className="text-xs text-slate-400 mb-2">เช่น ทานข้าวนอกบ้าน, งานอดิเรก, ใส่ซองงานแต่ง</p>
                                        <div className="relative">
                                            <span className="absolute left-4 top-4 text-slate-400 font-bold">฿</span>
                                            <input type="text" inputMode="numeric" value={data.discretionaryExp} onChange={handleNumberInput('discretionaryExp')} className="w-full pl-10 pr-4 py-4 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:border-emerald-500 outline-none text-xl font-bold" placeholder="0" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-1">รายจ่ายก้อนใหญ่ใน 3-5 ปีข้างหน้า (บาท)</label>
                                        <p className="text-xs text-slate-400 mb-2">เช่น เผื่อเงินไว้ซ่อมแซมบ้าน หรือซื้อรถใหม่ (ถ้าไม่มีใส่ 0)</p>
                                        <div className="relative">
                                            <span className="absolute left-4 top-4 text-slate-400 font-bold">฿</span>
                                            <input type="text" inputMode="numeric" value={data.largeExp} onChange={handleNumberInput('largeExp')} className="w-full pl-10 pr-4 py-4 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:border-emerald-500 outline-none text-xl font-bold" placeholder="0" />
                                        </div>
                                    </div>
                                    <div className="bg-rose-50 p-4 rounded-xl border border-rose-100 flex items-center justify-between gap-4">
                                        <div>
                                            <label className="block font-bold text-rose-800 text-sm mb-1">อัตราเงินเฟ้อ (%)</label>
                                            <p className="text-[10px] text-rose-600">ค่าครองชีพที่สูงขึ้นต่อปี</p>
                                        </div>
                                        <input type="number" value={data.inflation} onChange={handleNumberInput('inflation')} className="w-20 px-3 py-2 bg-white border border-rose-200 rounded-lg outline-none text-center font-bold text-rose-700" step="0.1" />
                                    </div>
                                </div>
                                <div className="flex gap-4 mt-8">
                                    <button onClick={prevStep} className="w-1/3 bg-slate-100 text-slate-600 font-bold text-lg py-4 rounded-2xl hover:bg-slate-200 transition-all">ย้อนกลับ</button>
                                    <button onClick={nextStep} className="w-2/3 bg-slate-800 text-white font-bold text-lg py-4 rounded-2xl hover:bg-slate-700 transition-all">ถัดไป 👉</button>
                                </div>
                            </div>
                        )}

                        {/* --- STEP 3: สุขภาพ --- */}
                        {step === 3 && (
                            <div className="bg-white rounded-3xl p-6 md:p-10 shadow-xl shadow-slate-200/50 border border-slate-100 fade-in">
                                <h2 className="text-2xl font-black text-slate-800 mb-2">หมวด 3: สุขภาพ & เกราะป้องกัน 🏥</h2>
                                <p className="text-slate-500 text-sm mb-8">ความเสี่ยงอันดับ 1 ของวัยเกษียณคือค่ารักษาพยาบาล</p>
                                
                                <div className="space-y-6">
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-3">1. สวัสดิการค่ารักษาพยาบาลหลักของคุณ?</label>
                                        <div className="space-y-3">
                                            <label className={`flex items-center gap-3 p-4 rounded-xl border-2 cursor-pointer transition-all ${data.healthCover === 'excellent' ? 'border-emerald-500 bg-emerald-50' : 'border-slate-200 bg-slate-50 hover:border-slate-300'}`}>
                                                <input type="radio" checked={data.healthCover === 'excellent'} onChange={() => updateData('healthCover', 'excellent')} className="w-5 h-5 accent-emerald-600" />
                                                <div>
                                                    <div className="font-bold text-slate-800">ครอบคลุมสูง (เบิกได้เกือบหมด)</div>
                                                    <div className="text-xs text-slate-500">ข้าราชการบำนาญ หรือ ประกันสุขภาพเหมาจ่าย</div>
                                                </div>
                                            </label>
                                            <label className={`flex items-center gap-3 p-4 rounded-xl border-2 cursor-pointer transition-all ${data.healthCover === 'partial' ? 'border-amber-500 bg-amber-50' : 'border-slate-200 bg-slate-50 hover:border-slate-300'}`}>
                                                <input type="radio" checked={data.healthCover === 'partial'} onChange={() => updateData('healthCover', 'partial')} className="w-5 h-5 accent-amber-600" />
                                                <div>
                                                    <div className="font-bold text-slate-800">ครอบคลุมบางส่วน (อาจมีส่วนต่าง)</div>
                                                    <div className="text-xs text-slate-500">บัตรทอง, ประกันสังคม, หรือประกันที่จำกัดวงเงิน</div>
                                                </div>
                                            </label>
                                            <label className={`flex items-center gap-3 p-4 rounded-xl border-2 cursor-pointer transition-all ${data.healthCover === 'none' ? 'border-rose-500 bg-rose-50' : 'border-slate-200 bg-slate-50 hover:border-slate-300'}`}>
                                                <input type="radio" checked={data.healthCover === 'none'} onChange={() => updateData('healthCover', 'none')} className="w-5 h-5 accent-rose-600" />
                                                <div>
                                                    <div className="font-bold text-slate-800">จ่ายเองทั้งหมด / เอกชน 100%</div>
                                                </div>
                                            </label>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-3">2. โรคประจำตัว หรือความกังวลด้านสุขภาพ?</label>
                                        <div className="flex gap-4">
                                            <label className={`flex-1 flex flex-col items-center gap-2 p-4 rounded-xl border-2 cursor-pointer transition-all ${data.healthConcern === 'low' ? 'border-blue-500 bg-blue-50' : 'border-slate-200 bg-slate-50'}`}>
                                                <input type="radio" checked={data.healthConcern === 'low'} onChange={() => updateData('healthConcern', 'low')} className="hidden" />
                                                <span className="text-3xl">🏃‍♂️</span>
                                                <span className="font-bold text-sm text-slate-700">แข็งแรงดี ไม่มีโรค</span>
                                            </label>
                                            <label className={`flex-1 flex flex-col items-center gap-2 p-4 rounded-xl border-2 cursor-pointer transition-all ${data.healthConcern === 'high' ? 'border-rose-500 bg-rose-50' : 'border-slate-200 bg-slate-50'}`}>
                                                <input type="radio" checked={data.healthConcern === 'high'} onChange={() => updateData('healthConcern', 'high')} className="hidden" />
                                                <span className="text-3xl">🩺</span>
                                                <span className="font-bold text-sm text-slate-700">มีโรคที่ต้องพบแพทย์</span>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                                <div className="flex gap-4 mt-8">
                                    <button onClick={prevStep} className="w-1/3 bg-slate-100 text-slate-600 font-bold text-lg py-4 rounded-2xl hover:bg-slate-200 transition-all">ย้อนกลับ</button>
                                    <button onClick={nextStep} className="w-2/3 bg-slate-800 text-white font-bold text-lg py-4 rounded-2xl hover:bg-slate-700 transition-all">ถัดไป 👉</button>
                                </div>
                            </div>
                        )}

                        {/* --- STEP 4: เป้าหมาย --- */}
                        {step === 4 && (
                            <div className="bg-white rounded-3xl p-6 md:p-10 shadow-xl shadow-slate-200/50 border border-slate-100 fade-in">
                                <h2 className="text-2xl font-black text-slate-800 mb-2">หมวด 4: สไตล์การลงทุน 🎯</h2>
                                <p className="text-slate-500 text-sm mb-8">เราจะนำคะแนนส่วนนี้ไปผสานกันเพื่อเลือกรุ่นพอร์ตให้คุณ</p>
                                
                                <div className="space-y-6">
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-3">1. รับความผันผวน (เงินต้นลดลงชั่วคราว อาจมากถึง -50%) ได้แค่ไหน?</label>
                                        <div className="grid grid-cols-3 gap-2 sm:gap-3">
                                            <label className={`flex flex-col items-center justify-center text-center gap-2 p-3 sm:p-4 rounded-xl border-2 cursor-pointer transition-all ${data.risk === 'low' ? 'border-rose-500 bg-rose-50' : 'border-slate-200 bg-slate-50'}`}>
                                                <input type="radio" checked={data.risk === 'low'} onChange={() => updateData('risk', 'low')} className="hidden" />
                                                <span className="text-2xl">😨</span>
                                                <span className="font-bold text-[10px] sm:text-xs text-slate-700">กังวลสุดๆ<br/>(รับได้ต่ำ)</span>
                                            </label>
                                            <label className={`flex flex-col items-center justify-center text-center gap-2 p-3 sm:p-4 rounded-xl border-2 cursor-pointer transition-all ${data.risk === 'medium' ? 'border-amber-500 bg-amber-50' : 'border-slate-200 bg-slate-50'}`}>
                                                <input type="radio" checked={data.risk === 'medium'} onChange={() => updateData('risk', 'medium')} className="hidden" />
                                                <span className="text-2xl">🤔</span>
                                                <span className="font-bold text-[10px] sm:text-xs text-slate-700">เข้าใจตลาด<br/>(ปานกลาง)</span>
                                            </label>
                                            <label className={`flex flex-col items-center justify-center text-center gap-2 p-3 sm:p-4 rounded-xl border-2 cursor-pointer transition-all ${data.risk === 'high' ? 'border-emerald-500 bg-emerald-50' : 'border-slate-200 bg-slate-50'}`}>
                                                <input type="radio" checked={data.risk === 'high'} onChange={() => updateData('risk', 'high')} className="hidden" />
                                                <span className="text-2xl">😎</span>
                                                <span className="font-bold text-[10px] sm:text-xs text-slate-700">ใจนิ่งรับได้<br/>(รับได้สูง)</span>
                                            </label>
                                        </div>
                                    </div>
                                    
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-3">2. ความตั้งใจหลักของ "เงินลงทุน" ก้อนนี้?</label>
                                        <div className="space-y-3">
                                            <label className={`flex items-center gap-3 p-4 rounded-xl border-2 cursor-pointer transition-all ${data.goal === 'protect' ? 'border-slate-500 bg-slate-50' : 'border-slate-200 hover:bg-slate-50'}`}>
                                                <input type="radio" checked={data.goal === 'protect'} onChange={() => updateData('goal', 'protect')} className="w-5 h-5 accent-slate-600" />
                                                <div>
                                                    <div className="font-bold text-slate-800">เน้นปกป้องเงินต้น 🛡️</div>
                                                    <div className="text-xs text-slate-500">ผลตอบแทนต่ำไม่เป็นไร ขอให้เงินอยู่ครบ</div>
                                                </div>
                                            </label>
                                            <label className={`flex items-center gap-3 p-4 rounded-xl border-2 cursor-pointer transition-all ${data.goal === 'cashflow' ? 'border-blue-500 bg-blue-50' : 'border-slate-200 hover:bg-slate-50'}`}>
                                                <input type="radio" checked={data.goal === 'cashflow'} onChange={() => updateData('goal', 'cashflow')} className="w-5 h-5 accent-blue-600" />
                                                <div>
                                                    <div className="font-bold text-slate-800">เน้นกระแสเงินสด (ปันผล) 💸</div>
                                                    <div className="text-xs text-slate-500">อยากให้เงินก้อนนี้งอกออกมาเป็นรายเดือนไว้ใช้จ่าย</div>
                                                </div>
                                            </label>
                                            <label className={`flex items-center gap-3 p-4 rounded-xl border-2 cursor-pointer transition-all ${data.goal === 'growth' ? 'border-purple-500 bg-purple-50' : 'border-slate-200 hover:bg-slate-50'}`}>
                                                <input type="radio" checked={data.goal === 'growth'} onChange={() => updateData('goal', 'growth')} className="w-5 h-5 accent-purple-600" />
                                                <div>
                                                    <div className="font-bold text-slate-800">เน้นเติบโตเพื่อเป็นมรดก 📈</div>
                                                    <div className="text-xs text-slate-500">เงินเย็นมาก ปล่อยทิ้งไว้ได้ยาวๆ ให้ลูกหลาน</div>
                                                </div>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                                <div className="flex gap-4 mt-8">
                                    <button onClick={prevStep} className="w-1/3 bg-slate-100 text-slate-600 font-bold text-lg py-4 rounded-2xl hover:bg-slate-200 transition-all">ย้อนกลับ</button>
                                    <button onClick={nextStep} className="w-2/3 bg-emerald-600 text-white font-black text-lg py-4 rounded-2xl hover:bg-emerald-500 transition-all shadow-lg shadow-emerald-600/30">วิเคราะห์แผน 🎉</button>
                                </div>
                            </div>
                        )}

                        {/* --- STEP 5: ผลลัพธ์ (Dashboard) --- */}
                        {step === 5 && analysis && (
                            <div className="space-y-6 fade-in">
                                
                                {/* Section: SWR & Survival Status */}
                                <div className={`bg-white rounded-3xl p-6 shadow-xl border-2 ${analysis.swrIcon} relative overflow-hidden`}>
                                    <div className="flex items-center gap-3 mb-2">
                                        <div className={`p-2 rounded-xl ${analysis.swrIcon} text-xl`}>🩺</div>
                                        <div>
                                            <h2 className={`text-xl font-black ${analysis.swrClass}`}>{analysis.swrStatus}</h2>
                                            <div className="text-xs font-bold text-slate-500">ผลการตรวจสุขภาพทางการเงิน (ประเมินที่ {analysis.yearsRemaining} ปี)</div>
                                        </div>
                                    </div>
                                    <p className="text-sm font-medium text-slate-700 leading-relaxed mt-4 bg-white/60 p-4 rounded-xl border border-white/50 backdrop-blur-sm">
                                        {analysis.swrMessage}
                                    </p>
                                </div>

                                {/* Section: The Buckets */}
                                <div className="bg-white rounded-3xl p-6 shadow-xl border border-slate-100">
                                    <h2 className="text-2xl font-black text-slate-800 mb-1 flex items-center gap-2">🪣 กลยุทธ์แยกถังเงิน (Bucket Strategy)</h2>
                                    <p className="text-sm text-slate-500 mb-6">หลักการคือแยกระหว่าง "เงินที่ต้องพร้อมใช้" ออกจาก "เงินลงทุน" เพื่อป้องกันการขายหุ้นตอนขาดทุน</p>
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        {/* ถังปลอดภัย */}
                                        <div className="bg-slate-50 rounded-2xl p-5 border-2 border-slate-200 relative overflow-hidden">
                                            <div className="absolute top-0 right-0 bg-slate-200 text-slate-600 text-[10px] font-bold px-3 py-1 rounded-bl-xl">ถังที่ 1: สภาพคล่อง</div>
                                            <h3 className="font-black text-lg text-slate-700 flex items-center gap-2">🛡️ ถังสำรองปลอดภัย</h3>
                                            <div className="text-3xl font-black text-slate-800 mt-2 mb-4">{formatMoney(analysis.safeBucketTotal)}</div>
                                            
                                            <div className="space-y-2 text-[13px]">
                                                <div className="flex justify-between border-b border-slate-200 pb-1">
                                                    <span className="text-slate-500">กันไว้สำหรับค่ากินอยู่ 1 ปี</span>
                                                    <span className="font-bold">{formatMoney(analysis.livingReserve)}</span>
                                                </div>
                                                <div className="flex justify-between border-b border-slate-200 pb-1">
                                                    <span className="text-slate-500">กันไว้สำหรับสุขภาพ/ฉุกเฉิน</span>
                                                    <span className="font-bold">{formatMoney(analysis.healthBuffer)}</span>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span className="text-slate-500">รายจ่ายก้อนใหญ่ระยะสั้น</span>
                                                    <span className="font-bold">{formatMoney(analysis.largeExp)}</span>
                                                </div>
                                            </div>
                                        </div>

                                        {/* ถังลงทุน */}
                                        <div className={`rounded-2xl p-5 border-2 relative overflow-hidden ${analysis.investableCapital > 0 ? 'bg-emerald-50 border-emerald-200' : 'bg-amber-50 border-amber-200'}`}>
                                            <div className={`absolute top-0 right-0 text-[10px] font-bold px-3 py-1 rounded-bl-xl ${analysis.investableCapital > 0 ? 'bg-emerald-200 text-emerald-800' : 'bg-amber-200 text-amber-800'}`}>ถังที่ 2: การลงทุน</div>
                                            <h3 className={`font-black text-lg flex items-center gap-2 ${analysis.investableCapital > 0 ? 'text-emerald-800' : 'text-amber-800'}`}>📈 ถังสำหรับจัดพอร์ตลงทุน</h3>
                                            
                                            {analysis.investableCapital > 0 ? (
                                                <>
                                                    <div className="text-3xl font-black text-emerald-600 mt-2 mb-4">{formatMoney(analysis.investableCapital)}</div>
                                                    <p className="text-[13px] text-emerald-700 font-medium">นี่คือเงินเย็นสุทธิ หลังจากหักหนี้และเงินสำรองฉุกเฉินแล้ว สามารถนำมาจัดพอร์ตให้เงินทำงานชนะเงินเฟ้อได้สบายใจ</p>
                                                </>
                                            ) : (
                                                <div className="mt-3">
                                                    <div className="text-3xl font-black text-amber-600 mb-2">฿0</div>
                                                    <p className="text-[13px] text-amber-700 font-medium">เงินก้อนที่คุณมี เหมาะสำหรับการเก็บในสินทรัพย์สภาพคล่องสูง เพื่อให้อุ่นใจและรองรับรายจ่ายพื้นฐานก่อนครับ</p>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>

                                {/* Section: Portfolio Recommendation */}
                                {analysis.investableCapital > 0 && (
                                    <div className="bg-white rounded-3xl p-6 shadow-xl border border-slate-100">
                                        <h2 className="text-xl font-black text-slate-800 mb-1">โมเดลพอร์ตแนะนำสำหรับคุณ 📊</h2>
                                        <p className="text-sm text-slate-500 mb-6">จัดตามระดับความเสี่ยงและเป้าหมายที่คุณเลือก: <strong className="text-emerald-600">{analysis.strategyName}</strong></p>
                                        
                                        <div className="flex flex-col md:flex-row items-center gap-8">
                                            {/* Graph with Center Text */}
                                            <div className="w-full md:w-1/2 h-64 relative">
                                                <ResponsiveContainer width="100%" height="100%">
                                                    <PieChart>
                                                        <Pie data={analysis.portfolio} cx="50%" cy="50%" innerRadius={65} outerRadius={95} paddingAngle={5} dataKey="value">
                                                            {analysis.portfolio.map((entry, index) => (
                                                                <Cell key={`cell-${index}`} fill={entry.color} />
                                                            ))}
                                                        </Pie>
                                                        <Tooltip formatter={(value) => formatMoney(value)} />
                                                    </PieChart>
                                                </ResponsiveContainer>
                                                <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                                                    <span className="text-xs text-slate-500 font-bold">ยอดจัดพอร์ต</span>
                                                    <span className="font-black text-slate-800 text-lg">{formatShort(analysis.investableCapital)}</span>
                                                </div>
                                            </div>
                                            
                                            {/* Breakdown */}
                                            <div className="w-full md:w-1/2 space-y-4">
                                                <div className="bg-slate-50 p-4 rounded-xl border border-slate-100 mb-4 text-center">
                                                    <div className="text-[11px] font-bold text-slate-500 uppercase">ผลตอบแทนคาดหวังของพอร์ตนี้</div>
                                                    <div className="text-xl font-black text-emerald-600">{analysis.expectedReturn}</div>
                                                </div>
                                                
                                                {analysis.portfolio.map((item, i) => (
                                                    <div key={i} className="flex justify-between items-start text-sm border-b border-slate-100 pb-3">
                                                        <div className="flex items-start gap-2 pr-4">
                                                            <div className="w-3 h-3 rounded-full mt-1 shrink-0" style={{backgroundColor: item.color}}></div>
                                                            <span className="font-bold text-slate-700 leading-snug">{item.name}</span>
                                                        </div>
                                                        <div className="text-right shrink-0">
                                                            <div className="font-black text-slate-800 bg-slate-100 px-2 rounded">{((item.value / analysis.investableCapital) * 100).toFixed(0)}%</div>
                                                            <div className="text-[11px] text-slate-500 font-medium mt-1">{formatMoney(item.value)}</div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* Actions */}
                                <div className="flex flex-col gap-3 pt-4">
                                    <button onClick={copyPlan} id="btnCopyPlan" className="w-full bg-slate-800 text-white font-bold py-4 rounded-2xl hover:bg-slate-700 transition shadow-lg flex items-center justify-center gap-2">
                                        📄 คัดลอกสรุปแผน (Copy & Share)
                                    </button>
                                    <button onClick={resetApp} className="text-slate-500 font-bold hover:text-slate-800 py-2">
                                        🔄 ทำแบบประเมินใหม่อีกครั้ง
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
